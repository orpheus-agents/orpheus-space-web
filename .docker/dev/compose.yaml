name: orpheus-space-web-dev
x-space: &space
  image: orpheus-space-web-core:${ORPHEUS_SPACE_COMMIT:?Use npm run stack:start}
  build:
    context: ${ORPHEUS_SPACE_CONTEXT:?Use npm run stack:start}
    dockerfile: .docker/app/prod/Dockerfile
services:
  core-db:
    image: postgres:16.10
    environment:
      POSTGRES_DB: orpheus
      POSTGRES_USER: orpheus
      POSTGRES_PASSWORD: fixture-password
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U orpheus]
      interval: 2s
      timeout: 2s
      retries: 30
  core-migrate:
    image: retailcrm/orpheus:0.6.0
    command: [migrate, up]
    environment:
      DATABASE_URL: postgres://orpheus:fixture-password@core-db:5432/orpheus
    depends_on:
      core-db: {condition: service_healthy}
  core:
    image: retailcrm/orpheus:0.6.0
    environment:
      DATABASE_URL: postgres://orpheus:fixture-password@core-db:5432/orpheus
      PUBLIC_API_KEYS: '["fixture-core-key"]'
      ENV_ENCRYPTION_KEY: Zm9yLWxvY2FsLWRldmVsb3BtZW50LW9ubHktMzJieXQ=
      ORPHEUS_CONFIG_FILE: /etc/orpheus/config.toml
    volumes: [./core.toml:/etc/orpheus/config.toml:ro]
    healthcheck:
      interval: 2s
      timeout: 3s
      start_period: 5s
      retries: 30
    depends_on:
      core-migrate: {condition: service_completed_successfully}
  db:
    image: postgres:16.10
    environment:
      POSTGRES_DB: orpheus
      POSTGRES_USER: orpheus
      POSTGRES_PASSWORD: fixture-password
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U orpheus]
      interval: 2s
      timeout: 2s
      retries: 30
  migrate:
    <<: *space
    command: [migrate, up]
    environment:
      DATABASE_URL: postgres://orpheus:fixture-password@db:5432/orpheus
    depends_on:
      db: {condition: service_healthy}
  space:
    <<: *space
    environment:
      DATABASE_URL: postgres://orpheus:fixture-password@db:5432/orpheus
      PUBLIC_API_KEYS: '["integration-only-key"]'
      ORPHEUS_CONFIG_FILE: /etc/orpheus/config.toml
      ORPHEUS_BASE_URL: http://core:8000
      ORPHEUS_API_KEY: fixture-core-key
      ORPHEUS_BROWSER_AUTH: anonymous
      ORPHEUS_PUBLIC_URL: ${ORPHEUS_PUBLIC_URL:?Use npm run stack:start}
    volumes: [./space.toml:/etc/orpheus/config.toml:ro]
    healthcheck:
      interval: 2s
      timeout: 3s
      start_period: 5s
      retries: 30
    depends_on:
      migrate: {condition: service_completed_successfully}
      core: {condition: service_healthy}
  ui:
    build:
      context: ../..
      dockerfile: .docker/app/prod/Dockerfile
    environment:
      ORPHEUS_SPACE_UPSTREAM: http://space:8000
    ports: ['127.0.0.1:${ORPHEUS_SPACE_WEB_HTTP_PORT:-18095}:8080']
    healthcheck:
      interval: 2s
      timeout: 3s
      retries: 15
    depends_on:
      space: {condition: service_healthy}
