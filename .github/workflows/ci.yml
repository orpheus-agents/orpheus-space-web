name: CI
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned container check tools
        env:
          HADOLINT_VERSION: 2.14.0
          TRIVY_VERSION: 0.70.0
        run: |
          mkdir -p "$RUNNER_TEMP/check-tools"
          curl --fail --silent --show-error --location "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64" -o "$RUNNER_TEMP/check-tools/hadolint"
          chmod +x "$RUNNER_TEMP/check-tools/hadolint"
          curl --fail --silent --show-error --location "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -o "$RUNNER_TEMP/trivy.tar.gz"
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP/check-tools" trivy
          echo "$RUNNER_TEMP/check-tools" >> "$GITHUB_PATH"
      - run: npm ci
      - name: Verify pinned OpenAPI provenance
        run: npm run api:verify
      - name: Check generation, lint, tests, unused dependencies, vulnerabilities and build
        run: make check
      - run: npx playwright install --with-deps chromium
      - name: Browser fixture tests
        run: make test-e2e
      - name: Production nginx, Space and Keycloak integration
        run: make test-integration
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-results
          path: test-results/
  publish-image:
    needs: checks
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Docker image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: retailcrm/orpheus-space-web
          tags: type=semver,pattern={{version}}
      - name: Check publishing configuration
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$IMAGE_TAGS" || { echo 'A valid version tag such as v1.2.3 is required.' >&2; exit 1; }
          test -n "$DOCKERHUB_USERNAME" || { echo 'Set the DOCKERHUB_USERNAME repository variable.' >&2; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo 'Set the DOCKERHUB_TOKEN repository secret.' >&2; exit 1; }
      - name: Set up QEMU for the arm64 nginx runtime stage
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .docker/app/prod/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-image
          cache-to: type=gha,mode=max,scope=release-image
